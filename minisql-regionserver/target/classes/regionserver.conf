# RegionServer Configuration

# Server settings
regionserver.id=rs-001
regionserver.port=8001
regionserver.host=0.0.0.0

# Master connection settings
master.host=localhost
master.port=8000
master.heartbeat.interval.ms=3000

# MySQL settings
storage.backend=memory
mysql.host=localhost
mysql.port=3306
mysql.database=minisql
mysql.username=root
mysql.password=password
mysql.connection.pool.size=10
mysql.connection.timeout=30000

# Region settings
region.max.size.mb=256
region.memstore.flush.threshold.mb=64
region.compaction.interval.ms=3600000

# WAL settings
wal.enabled=true
wal.path=./wal
wal.sync.policy=SYNC

# Cache settings
cache.block.size.mb=64
cache.max.size.mb=512

# Thread pool settings
thread.pool.size=20

# Logging settings
log.level=INFO
log.file.path=./logs
